[project]
name = "sol-mcp-server"
version = "0.1.0"
description = "The most comprehensive MCP server for Solana — balances, tokens, NFTs, swaps, transactions, wallet analysis, and DeFi data"
authors = [{ name = "Yoshi Kondo", email = "yoshi@musicailab.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.urls]
"Homepage" = "https://github.com/yksanjo/sol-mcp-server"
"Repository" = "https://github.com/yksanjo/sol-mcp-server"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sol_mcp_server*"]
